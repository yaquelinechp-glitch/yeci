# Base de datos gestionada por Render.
# Nota: el plan "free" caduca a los 30 dias (límite de Render). Para producción,
# cambia plan a "0.5c-1g" o elimina este bloque y define DATABASE_URL a mano
# (Neon, Supabase, etc.).
databases:
  - name: yeci-db
    plan: free
    databaseName: yeci
    user: yeci
    region: oregon

services:
  - type: web
    name: yeci
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |-
      cd ../frontend && npm install && npm run build:prod && cd ../backend && pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_data && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.14
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: AI_PROVIDER
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: yeci-db
          property: connectionString
